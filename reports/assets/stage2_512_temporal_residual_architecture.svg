<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="640" viewBox="0 0 1380 640">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .label { font: 700 22px Arial, sans-serif; fill: #111827; }
      .text { font: 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 16px Arial, sans-serif; fill: #374151; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 8; }
      .main { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .res { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 8; }
      .loss { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 8; }
      .warn { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #b45309; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="42" y="48" class="title">b62/b63: fixed-S0 base path plus zero-init temporal residual from raw F tokens</text>

  <rect x="40" y="92" width="220" height="92" class="box"/>
  <text x="62" y="128" class="label">DiTing backbone</text>
  <text x="62" y="158" class="text">raw time tokens F</text>

  <rect x="320" y="92" width="230" height="92" class="main"/>
  <text x="346" y="128" class="label">station adapter</text>
  <text x="346" y="158" class="text">attention pooling</text>
  <text x="346" y="178" class="small">F -> S0</text>

  <rect x="620" y="92" width="300" height="92" class="main"/>
  <text x="646" y="128" class="label">target cross-attention</text>
  <text x="646" y="158" class="text">T attends fixed S0</text>
  <text x="646" y="178" class="small">same PGA path as b54</text>

  <rect x="990" y="92" width="190" height="92" class="main"/>
  <text x="1030" y="128" class="label">base head</text>
  <text x="1026" y="158" class="text">pga_base</text>

  <rect x="320" y="284" width="260" height="112" class="res"/>
  <text x="346" y="320" class="label">temporal projection</text>
  <text x="346" y="350" class="text">Linear C=1792 -> 256</text>
  <text x="346" y="376" class="small">applied before stacking stations</text>

  <rect x="650" y="284" width="300" height="112" class="res"/>
  <text x="676" y="320" class="label">target-conditioned pool</text>
  <text x="676" y="350" class="text">condition: T, S0, event, geometry</text>
  <text x="676" y="376" class="small">time-basis attention over F</text>

  <rect x="1018" y="284" width="220" height="112" class="res"/>
  <text x="1044" y="320" class="label">delta head</text>
  <text x="1044" y="350" class="text">delta_pga</text>
  <text x="1044" y="376" class="small">final linear zero-init</text>

  <rect x="1052" y="478" width="240" height="76" class="loss"/>
  <text x="1082" y="512" class="label">final PGA</text>
  <text x="1082" y="540" class="text">pga_base + delta_pga</text>

  <rect x="650" y="478" width="290" height="76" class="loss"/>
  <text x="676" y="512" class="label">b63 only</text>
  <text x="676" y="540" class="text">loss(delta, y - stopgrad(base))</text>

  <rect x="42" y="488" width="470" height="72" class="warn"/>
  <text x="66" y="522" class="label">No scalar gate on delta</text>
  <text x="66" y="548" class="text">identity is reached by zero-init output, but gradients remain usable.</text>

  <path d="M260 138 H320" class="arrow"/>
  <path d="M550 138 H620" class="arrow"/>
  <path d="M920 138 H990" class="arrow"/>
  <path d="M1180 138 C1260 138 1270 420 1190 478" class="arrow"/>

  <path d="M150 184 C150 260 250 340 320 340" class="arrow2"/>
  <path d="M580 340 H650" class="arrow2"/>
  <path d="M950 340 H1018" class="arrow2"/>
  <path d="M1128 396 V478" class="arrow2"/>

  <path d="M770 184 V284" class="dash"/>
  <path d="M1085 184 C1040 220 1010 260 950 312" class="dash"/>
  <path d="M1128 396 C1020 450 930 476 850 478" class="dash"/>
</svg>
