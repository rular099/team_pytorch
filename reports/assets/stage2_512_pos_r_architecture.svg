<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 21px Arial, sans-serif; fill: #374151; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .small { font: 17px Arial, sans-serif; fill: #374151; }
      .note { font: 16px Arial, sans-serif; fill: #4b5563; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 2.2; rx: 10; }
      .station { fill: #ecfdf5; stroke: #047857; stroke-width: 2.2; rx: 10; }
      .target { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.2; rx: 10; }
      .variant { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 10; }
      .danger { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2.2; rx: 10; }
      .muted { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2.0; stroke-dasharray: 9 7; rx: 10; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #2563eb; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-blue); }
      .red { stroke: #b91c1c; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .plain { stroke: #374151; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1220" fill="#ffffff"/>
  <text x="60" y="58" class="title">Stage2 512 revised pos-r architecture</text>
  <text x="60" y="92" class="subtitle">R1/R2 keep identity station memory; R3-R5 test first-residual station context; R6-R8 test synchronous station-target evolution.</text>

  <rect x="42" y="125" width="1816" height="235" class="section"/>
  <text x="70" y="160" class="subtitle">1. Shared token construction</text>

  <rect x="75" y="195" width="230" height="72" class="box"/>
  <text x="98" y="224" class="label">Waveform window</text>
  <text x="98" y="250" class="small">3 components</text>

  <rect x="75" y="285" width="230" height="52" class="box"/>
  <text x="98" y="318" class="label">Station coords</text>

  <rect x="350" y="188" width="270" height="88" class="station"/>
  <text x="378" y="220" class="label">DiTing backbone</text>
  <text x="378" y="248" class="small">+ station adapter</text>

  <rect x="350" y="292" width="270" height="52" class="station"/>
  <text x="378" y="325" class="label">Coordinate embedding</text>

  <rect x="665" y="205" width="260" height="82" class="station"/>
  <text x="690" y="237" class="label">Station token S0</text>
  <text x="690" y="264" class="small">wave + coord + amplitude</text>

  <rect x="665" y="300" width="260" height="44" class="variant"/>
  <text x="690" y="329" class="label">Optional station VS30</text>

  <rect x="1040" y="190" width="260" height="70" class="target"/>
  <text x="1068" y="220" class="label">Target query T0</text>
  <text x="1068" y="246" class="small">target coord + learned token</text>

  <rect x="1040" y="282" width="260" height="52" class="variant"/>
  <text x="1068" y="315" class="label">Optional target VS30</text>

  <text x="1375" y="210" class="note">VS30 feature: [log(VS30 / 760), valid] -&gt; Linear -&gt; scalar gate</text>
  <text x="1375" y="242" class="note">VS30 enabled in R2, R5, and R8.</text>
  <text x="1375" y="294" class="note">Target tokens are always query-only.</text>
  <text x="1375" y="326" class="note">They never attend other target tokens.</text>

  <path d="M305 231 L350 231" class="arrow"/>
  <path d="M305 311 L350 311" class="arrow"/>
  <path d="M620 232 L665 242" class="arrow"/>
  <path d="M620 318 L665 252" class="arrow"/>
  <path d="M925 322 L990 322 L1040 308" class="dashed"/>

  <rect x="42" y="390" width="1816" height="315" class="section"/>
  <text x="70" y="425" class="subtitle">2. Station memory alternatives</text>

  <rect x="80" y="475" width="295" height="92" class="station"/>
  <text x="110" y="510" class="label">R1 / R2: identity memory</text>
  <text x="110" y="538" class="small">M = S0</text>
  <text x="110" y="562" class="small">No station self-attention</text>

  <rect x="455" y="455" width="360" height="132" class="variant"/>
  <text x="485" y="490" class="label">R3-R5: first-residual context</text>
  <text x="485" y="518" class="small">Station block 1: standard Transformer residual</text>
  <text x="485" y="545" class="small">Station blocks 2-4: zero-init gated residuals</text>
  <text x="485" y="572" class="small">M = station context output</text>

  <rect x="880" y="455" width="380" height="132" class="danger"/>
  <text x="910" y="490" class="label">R6-R8: synchronous evolution</text>
  <text x="910" y="518" class="small">For layer l = 1..4:</text>
  <text x="910" y="545" class="small">S_l = station_block_l(S_{l-1})</text>
  <text x="910" y="572" class="small">T_l = target_cross_l(T_{l-1}, S_l)</text>

  <rect x="1335" y="455" width="355" height="132" class="variant"/>
  <text x="1365" y="490" class="label">RoPE when use_rope=true</text>
  <text x="1365" y="518" class="small">Station self-attn: rotate station Q/K</text>
  <text x="1365" y="545" class="small">Readout cross-attn: rotate target Q</text>
  <text x="1365" y="572" class="small">and station K in the same coordinate frame</text>

  <text x="80" y="640" class="note">Important diagnostic from R1-R8: first-residual and synchronous context changed station memory too aggressively, hurting train fit.</text>
  <path d="M795 287 L220 475" class="arrow"/>
  <path d="M795 287 L635 455" class="arrow"/>
  <path d="M795 287 L1070 455" class="arrow"/>
  <path d="M1168 260 L1070 455" class="red"/>
  <path d="M1512 455 L1512 430" class="dashed"/>

  <rect x="42" y="735" width="1816" height="365" class="section"/>
  <text x="70" y="770" class="subtitle">3. PGA target readout and expected comparisons</text>

  <rect x="82" y="825" width="330" height="104" class="target"/>
  <text x="112" y="858" class="label">Target-to-station readout</text>
  <text x="112" y="886" class="small">Layer 1 keeps target query residual</text>
  <text x="112" y="913" class="small">Layers 2-4 use zero-init gated residuals</text>

  <rect x="505" y="805" width="300" height="76" class="station"/>
  <text x="535" y="837" class="label">Station memory M</text>
  <text x="535" y="863" class="small">K/V for PGA readout</text>

  <rect x="505" y="910" width="300" height="76" class="target"/>
  <text x="535" y="942" class="label">Target query T</text>
  <text x="535" y="968" class="small">Q for PGA readout</text>

  <rect x="900" y="835" width="265" height="88" class="target"/>
  <text x="930" y="870" class="label">PGA MLP head</text>
  <text x="930" y="898" class="small">predict log PGA per target</text>

  <rect x="1240" y="805" width="500" height="220" class="box"/>
  <text x="1270" y="840" class="label">Comparison logic</text>
  <text x="1270" y="872" class="small">R1 vs R2: VS30-only under new schema</text>
  <text x="1270" y="904" class="small">R3 vs R4: synchronized RoPE on first-residual context</text>
  <text x="1270" y="936" class="small">R4 vs R5: VS30 interaction under first-residual context</text>
  <text x="1270" y="968" class="small">R6 vs R7: synchronized RoPE under synchronous evolution</text>
  <text x="1270" y="1000" class="small">R7 vs R8: VS30 interaction under synchronous evolution</text>

  <text x="82" y="1055" class="note">Decision rule: if station-context variants cannot fit train, do not interpret their RoPE or VS30 deltas as valid mechanism evidence.</text>

  <path d="M375 567 L505 842" class="arrow"/>
  <path d="M635 587 L560 805" class="arrow"/>
  <path d="M1070 587 L640 805" class="red"/>
  <path d="M1170 260 L610 910" class="arrow"/>
  <path d="M805 842 L900 875" class="arrow"/>
  <path d="M805 948 L900 885" class="arrow"/>
  <path d="M1165 879 L1240 879" class="arrow"/>
</svg>
